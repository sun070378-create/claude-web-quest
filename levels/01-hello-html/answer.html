<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 網頁標題：顯示在瀏覽器分頁上 -->
  <title>我的第一個網頁</title>
</head>
<body>

  <!-- h1：整頁最重要的大標題，一頁通常只有一個 -->
  <h1>哈囉，世界！</h1>

  <!-- p：一個段落。兩個 p 之間會自動空一行 -->
  <p>這是我寫的第一個網頁，雖然很簡單，但是是我自己<strong>一個字一個字</strong>打出來的。</p>
  <p>我正在學習 <strong>HTML</strong>，它是用來描述網頁內容的語言。</p>

  <!-- 闖關檢查器 -->
  <script src="../checker.js"></script>
  <script src="check.js"></script>
</body>
</html>
