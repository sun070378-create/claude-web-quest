<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 5 關：並排的魔法</title>

  <style>
    body {
      background-color: #f6f4ef;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      flex: 1;              /* 每張卡片平分剩下的空間 → 一樣寬 */
    }

    .card h3 {
      margin-top: 0;
    }

    /* 容器：display: flex 讓「直接在裡面的元素」橫向排成一排 */
    .cards {
      display: flex;
      gap: 16px;            /* 每個元素之間的距離 */
    }
  </style>
</head>
<body>

  <h1>我的創作</h1>

  <div class="cards">
    <div class="card">
      <h3>《午後的巷口》</h3>
      <p>攝影集。記錄住家附近巷子裡，下午三點的光線。</p>
    </div>
    <div class="card">
      <h3>《寫給十年後的自己》</h3>
      <p>散文。</p>
    </div>
    <div class="card">
      <h3>《城市裡的小綠地》</h3>
      <p>手繪地圖。把市區裡不起眼的小公園一個一個畫下來，附上我最喜歡的長椅位置。</p>
    </div>
  </div>

  <!-- 闖關檢查器 -->
  <script src="../checker.js"></script>
  <script src="check.js"></script>
</body>
</html>
