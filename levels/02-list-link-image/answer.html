<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 2 關：清單與連結</title>
</head>
<body>

  <h1>我喜歡的東西</h1>

  <!-- ul = 沒有順序的清單（前面是小圓點），每一項用 li -->
  <h2>喜歡的食物</h2>
  <ul>
    <li>牛肉麵</li>
    <li>蛋餅</li>
    <li>芒果冰</li>
  </ul>

  <!-- ol = 有順序的清單（前面是 1. 2. 3.） -->
  <h2>泡一杯茶</h2>
  <ol>
    <li>把水煮滾</li>
    <li>放入茶包</li>
    <li>等三分鐘後拿出茶包</li>
  </ol>

  <!-- a = 連結。href 是要去的網址，中間的字是畫面上看到的文字 -->
  <p>我常去的網站：<a href="https://developer.mozilla.org/zh-TW/">MDN 網頁教學文件</a></p>

  <!-- img = 圖片。src 是圖片位置，alt 是圖片的文字說明（圖片壞掉時會顯示，也幫助視障朋友） -->
  <!-- img 沒有結尾標籤 -->
  <img src="cat.svg" alt="一隻橘色的貓咪">

  <!-- 闖關檢查器 -->
  <script src="../checker.js"></script>
  <script src="check.js"></script>
</body>
</html>
