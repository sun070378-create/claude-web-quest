<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三章魔王：記憶翻牌遊戲</title>

  <style>
    body {
      background-color: #f1efe8;
      color: #333;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
      max-width: 460px;
      margin: 0 auto;
      padding: 32px 20px;
      text-align: center;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #restart {
      padding: 6px 16px;
      font: inherit;
      border: 2px solid #5b7a6e;
      border-radius: 8px;
      background-color: white;
      color: #5b7a6e;
      cursor: pointer;
    }

    /* 牌桌：4 × 4 的格子 */
    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* 每一張牌（還沒翻開：綠色背面，文字是透明的看不到） */
    .card {
      aspect-ratio: 1;               /* 寬高一樣 = 正方形 */
      font-size: 36px;
      border: none;
      border-radius: 10px;
      background-color: #5b7a6e;
      color: transparent;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
    }

    /* 翻開的牌：白色，看得到圖案 */
    .card.flipped,
    .card.matched {
      background-color: white;
      color: inherit;
    }

    /* 配對成功的牌：變淡 */
    .card.matched {
      opacity: 0.5;
      cursor: default;
    }

    #message {
      min-height: 1.7em;
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      color: #5b7a6e;
    }
  </style>
</head>

    function shuffle(array) {
      const result = array.slice();
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }
      return result;
