<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <!-- viewport：告訴手機「用裝置本身的寬度來顯示」，不然手機會假裝自己是電腦螢幕，把整頁縮小 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 6 關：手機也要好看</title>

  <style>
    body {
      background-color: #f6f4ef;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    .cards {
      display: flex;
      gap: 16px;
    }

    .card {
      flex: 1;
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .card h3 {
      margin-top: 0;
    }

    /* 圖片最寬就是容器的寬度，不會超出去；height: auto 讓比例不變形 */
    img {
      max-width: 100%;
      height: auto;
    }

    /* @media：只有在「螢幕寬度 600px 以下」時，裡面的 CSS 才會生效 */
    @media (max-width: 600px) {
      body {
        padding: 16px;       /* 手機上邊緣留白小一點 */
      }

      .cards {
        flex-direction: column;   /* 卡片改成上下排 */
      }
    }
  </style>
</head>
<body>

  <img src="banner.svg" alt="藍天和綠色山丘">

  <h1>我的創作</h1>

  <div class="cards">
    <div class="card">
      <h3>《午後的巷口》</h3>
      <p>攝影集。記錄住家附近巷子裡，下午三點的光線。</p>
    </div>
    <div class="card">
      <h3>《寫給十年後的自己》</h3>
      <p>散文。寫下現在的煩惱和願望，十年後再打開來看。</p>
    </div>
    <div class="card">
      <h3>《城市裡的小綠地》</h3>
      <p>手繪地圖。把市區裡不起眼的小公園一個一個畫下來。</p>
    </div>
  </div>

  <!-- 闖關檢查器 -->
  <script src="../checker.js"></script>
  <script src="check.js"></script>
</body>
</html>
